name: E2E Tests

on:
  # 推送到 main 分支時觸發
  push:
    branches: [main]

  # PR 到 main 時觸發
  pull_request:
    branches: [main]

  # 允許手動觸發
  workflow_dispatch:

# 設定 GitHub Pages 部署權限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 簽出程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: 安裝 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: 安裝專案依賴
      - name: Install dependencies
        run: npm ci

      # Step 4: 安裝 Playwright 瀏覽器
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Step 5: 執行 E2E 測試
      - name: Run E2E Tests
        run: npx playwright test

      # Step 6: 上傳 Allure 測試結果
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # Step 7: 上傳 Playwright 報告
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # 產生並部署 Allure 報告到 GitHub Pages
  allure-report:
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Copy history from gh-pages
        run: |
          mkdir -p allure-results/history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* allure-results/history/ || true
          fi

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

  # 發送 Slack 通知
  notify:
    needs: [test, allure-report]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.test.result }}
          fields: repo,message,commit,author,action,eventName,workflow,took
          text: |
            ${{ needs.test.result == 'success' && '✅ 測試通過！' || '❌ 測試失敗！' }}
            📊 報告: https://kusodevil.github.io/playwright-e2e-demo/
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
